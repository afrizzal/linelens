services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linelens-dev}
      POSTGRES_DB: ${POSTGRES_DB:-linelens}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linelens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3"]
      interval: 5s
      timeout: 5s
      retries: 10

  simulator:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["pnpm", "--filter", "@linelens/simulator", "start"]
    # Published (not just exposed) so the control endpoint is reachable from the
    # host — needed by the compose smoke test and by manual `curl` demos of
    # inject-breakdown without shelling into a container.
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://linelens:linelens-dev@db:5432/linelens}
      MQTT_URL: ${MQTT_URL:-mqtt://mqtt:1883}
      SIM_SPEED: ${SIM_SPEED:-60}
      SIM_SEED: ${SIM_SEED:-42}
      CONTROL_PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["pnpm", "--filter", "@linelens/worker", "start"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://linelens:linelens-dev@db:5432/linelens}
      MQTT_URL: ${MQTT_URL:-mqtt://mqtt:1883}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["pnpm", "--filter", "@linelens/web", "dev"]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://linelens:linelens-dev@db:5432/linelens}
      SIMULATOR_URL: ${SIMULATOR_URL:-http://simulator:4000}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy

volumes:
  postgres-data:
  mosquitto-data:
