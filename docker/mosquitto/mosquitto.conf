listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Mosquitto's built-in default (1000) silently caps how many QoS1/2 messages
# a clean:false persistent session (the worker's) can queue while its client
# is offline/down — once hit, further publishes for that session are
# DROPPED, not queued. Found via a Testcontainers integration test that
# published 1100 events to a disconnected worker session and only 1000
# survived redelivery on reconnect. That directly violates ENG-01's
# "raw machine_event rows are lossless" invariant on any outage long enough
# to accumulate >1000 queued events (a handful of real seconds at the
# demo's accelerated clock speeds across 8 machines). Unlimited is
# acceptable at this appliance's scale (a handful of lines/machines, not a
# fleet) — see PITFALLS.md's "don't add retention/partitioning up front"
# discipline; revisit only if it ever proves insufficient.
max_queued_messages 0
